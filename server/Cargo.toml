[package]
name = "display-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = { version = "^0.7.0" }
actix-identity = { version = "^0.9.0" }
actix-multipart = { version = "^0.8.5" }
actix-session = { version = "^0.11.0", features = ["cookie-session"]}
actix-web = { version = "^4.15.0" }
eink-convert = { version = "*", path = "../convert" }
env_logger = { version = "^0.11.11" }
hostname = { version = "^0.4.2" }
image = { version = "^0.25.10" }
log = { version = "^0.4.34" }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = { version = "^1.0.151" }
serde_repr = { version = "^0.1.21"}
thiserror = { version = "^2.0.21" }
tokio = { version = "^1.48.0", features = ["full"] }
uuid = {version = "^1.27.0", features = ["v4"] }

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
runner = "qemu-user"
