[package]
name = "display-server"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-files = { version = "^0.6.8" }
actix-identity = { version = "^0.9.0" }
actix-multipart = { version = "^0.7.2" }
actix-session = { version = "^0.11.0", features = ["cookie-session"]}
actix-web = { version = "^4.11.0" }
hostname = { version = "^0.4.1" }
eink-convert = { version = "*", path = "../convert" }
env_logger = { version = "^0.11.8" }
image = { version = "^0.25.8" }
log = { version = "^0.4.28" }
serde = { version = "^1.0.228", features = ["derive"] }
serde_json = { version = "^1.0.145" }
serde_repr = { version = "^0.1.20"}
thiserror = { version = "^2.0.17" }
tokio = { version = "^1.48.0", features = ["full"] }

[workspace.metadata.cross.target.aarch64-unknown-linux-gnu]
runner = "qemu-user"
