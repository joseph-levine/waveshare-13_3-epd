<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="stylesheet" href="css/pico.classless.min.css"/>
    <title>Frame</title>
    <style>
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-gap: 6px;
        }

        .grid-item {

        }

        .day-name {
            display: block;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .selected {
            box-shadow: 0 0 0 5px yellow;
            border-radius: 2px;
        }

        .flex-container {
            display: flex;
            align-items: baseline;
        }

        * {
            box-sizing: border-box;
        }
        .block {
            display: block;
        }
    </style>
</head>
<body>
<main>
    <form id="form" enctype="multipart/form-data">
        <h1>Family Frame</h1>
        <input type="file" name="file" accept="image/*" required="required"/>
        <fieldset>
            <h6 class="day-name">Monday</h6>
            <div class="grid-container">
                <img data-day="1" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/1/5?d=1 1x, thumbs/1/5?d=2 2x, thumbs/1/5?d=3 3x" alt="Monday 5am"
                     title="Monday 5am"/>
                <img data-day="1" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/1/12?d=1 1x, thumbs/1/12?d=2 2x, thumbs/1/12?d=3 3x" alt="Monday noon"
                     title="Monday noon"/>
                <img data-day="1" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/1/18?d=1 1x, thumbs/1/18?d=2 2x, thumbs/1/18?d=3 3x" alt="Monday 6pm"
                     title="Monday 6pm"/>
            </div>
            <h6 class="day-name">Tuesday</h6>
            <div class="grid-container">
                <img data-day="2" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/2/5?d=1 1x, thumbs/2/5?d=2 2x, thumbs/2/5?d=3 3x" alt="Tuesday 5am"
                     title="Tuesday 5am"/>
                <img data-day="2" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/2/12?d=1 1x, thumbs/2/12?d=2 2x, thumbs/2/12?d=3 3x" alt="Tuesday noon"
                     title="Tuesday noon"/>
                <img data-day="2" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/2/18?d=1 1x, thumbs/2/18?d=2 2x, thumbs/2/18?d=3 3x" alt="Tuesday 6pm"
                     title="Tuesday 6pm"/>
            </div>
            <h6 class="day-name">Wednesday</h6>
            <div class="grid-container">
                <img data-day="3" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/3/5?d=1 1x, thumbs/3/5?d=2 2x, thumbs/3/5?d=3 3x" alt="Wednesday 5am"
                     title="Wednesday 5am"/>
                <img data-day="3" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/3/12?d=1 1x, thumbs/3/12?d=2 2x, thumbs/3/12?d=3 3x" alt="Wednesday noon"
                     title="Wednesday noon"/>
                <img data-day="3" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/3/18?d=1 1x, thumbs/3/18?d=2 2x, thumbs/3/18?d=3 3x" alt="Wednesday 6pm"
                     title="Wednesday 6pm"/>
            </div>
            <h6 class="day-name">Thursday</h6>
            <div class="grid-container">
                <img data-day="4" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/4/5?d=1 1x, thumbs/4/5?d=2 2x, thumbs/4/5?d=3 3x" alt="Thursday 5am"
                     title="Thursday 5am"/>
                <img data-day="4" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/4/12?d=1 1x, thumbs/4/12?d=2 2x, thumbs/4/12?d=3 3x" alt="Thursday noon"
                     title="Thursday noon"/>
                <img data-day="4" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/4/18?d=1 1x, thumbs/4/18?d=2 2x, thumbs/4/18?d=3 3x" alt="Thursday 6pm"
                     title="Thursday 6pm"/>
            </div>
            <h6 class="day-name">Friday</h6>
            <div class="grid-container">
                <img data-day="5" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/5/5?d=1 1x, thumbs/5/5?d=2 2x, thumbs/5/5?d=3 3x" alt="Friday 5am"
                     title="Friday 5am"/>
                <img data-day="5" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/5/12?d=1 1x, thumbs/5/12?d=2 2x, thumbs/5/12?d=3 3x" alt="Friday noon"
                     title="Friday noon"/>
                <img data-day="5" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/5/18?d=1 1x, thumbs/5/18?d=2 2x, thumbs/5/18?d=3 3x" alt="Friday 6pm"
                     title="Friday 6pm"/>
            </div>
            <h6 class="day-name">Saturday</h6>
            <div class="grid-container">
                <img data-day="6" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/6/5?d=1 1x, thumbs/6/5?d=2 2x, thumbs/6/5?d=3 3x" alt="Saturday 5am"
                     title="Saturday 5am"/>
                <img data-day="6" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/6/12?d=1 1x, thumbs/6/12?d=2 2x, thumbs/6/12?d=3 3x" alt="Saturday noon"
                     title="Saturday noon"/>
                <img data-day="6" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/6/18?d=1 1x, thumbs/6/18?d=2 2x, thumbs/6/18?d=3 3x" alt="Saturday 6pm"
                     title="Saturday 6pm"/>
            </div>
            <h6 class="day-name">Sunday</h6>
            <div class="grid-container">
                <img data-day="7" data-hour="5" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/7/5?d=1 1x, thumbs/7/5?d=2 2x, thumbs/7/5?d=3 3x" alt="Sunday 5am"
                     title="Sunday 5am"/>
                <img data-day="7" data-hour="12" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/7/12?d=1 1x, thumbs/7/12?d=2 2x, thumbs/7/12?d=3 3x" alt="Sunday noon"
                     title="Sunday noon"/>
                <img data-day="7" data-hour="18" onclick="selectImg(this)" class="grid-item"
                     srcset="thumbs/7/18?d=1 1x, thumbs/7/18?d=2 2x, thumbs/7/18?d=3 3x" alt="Sunday 6pm"
                     title="Sunday 6pm"/>
            </div>
            <input type="hidden" id="day"/>
            <input type="hidden" id="hour"/>
        </fieldset>
        <fieldset>
        <label><input id="showNow" type="checkbox" name="showNow"/> Display
            Soonish</label>
        </fieldset>
        <input type="submit" id="submit"  disabled="disabled" value="Upload"/>
        <input type="button" id="showIt" disabled="disabled" value="Show Selected"/>
    </form>
</main>
<dialog id="uploadModal" closedby="any">
    <article>
        <form method="dialog">
            <header>
                <button aria-label="Close" rel="prev"></button>
                <h3>Uploaded successfully</h3>
            </header>
            <p>The file has been uploaded. It'll start dithering, and should be done in a minute or so.</p>
            <footer>
                <button autofocus="autofocus" role="button">Great!</button>
            </footer>
        </form>
    </article>
</dialog>
<dialog id="showImageModal" closedby="any">
    <article>
        <form method="dialog">
            <header>
                <button aria-label="Close" rel="prev"></button>
                <h3>Task launched</h3>
            </header>
            <p>The display task has been launched in the background. The display should change in under a minute.</p>
            <footer>
                <button autofocus="autofocus" role="button">Great!</button>
            </footer>
        </form>
    </article>
</dialog>
<script>
    const selectImg = (el) => {
        //get passed el
        const day = el.dataset.day
        const hour = el.dataset.hour
        for (const d of document.querySelectorAll(".selected")) {
            d.classList.remove("selected")
        }
        document.getElementById("submit").disabled = false
        document.getElementById("showIt").disabled = false
        document.getElementById("day").value = day
        document.getElementById("hour").value = hour
        el.classList.add("selected")
    };

    document.getElementById("form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const day = document.getElementById("day").value;
        const hour = document.getElementById("hour").value;

        const submitInput = document.getElementById("submit");
        submitInput.disabled = true;
        submitInput.value = "Submitted...";
        const formData = new FormData(event.target);
        formData.append("json", new Blob([JSON.stringify({show_now: document.getElementById("showNow").checked})], {type: "application/json"}))
        const response = await fetch(`/upload/${day}/${hour}`, {
            method: "POST",
            body: formData,
        });
        if (response.ok) {
            document.getElementById("uploadModal").show();
        } else {
            alert("upload failed");
        }
        submitInput.disabled = false;
        submitInput.value = "Upload";
    });

    document.getElementById("showIt").addEventListener("click", async () => {
        const day = document.getElementById("day").value;
        const hour = document.getElementById("hour").value;
        const displayInput = document.getElementById("showIt");
        displayInput.disabled = true;
        displayInput.value = "Requested..."

        const response = await fetch(`/show/${day}/${hour}`, {method: "POST"});
        if (response.ok) {
            document.getElementById("showImageModal").show();
        } else {
            alert("display failed");
        }
        displayInput.disabled = false;
        displayInput.value = "Show Selected"
    });

</script>
</body>
</html>
